[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sre-sdk"
version = "0.1.0"
description = "Generic runtime transport SDK for AegisSRE. Captures errors and runtime context and forwards them to the AegisSRE Runtime — no incident classification or intelligence lives in the SDK itself."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[tool.setuptools.packages.find]
include = ["aegis_sre*"]
